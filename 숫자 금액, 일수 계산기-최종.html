<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>업무 도구 · 올인원</title>
    <!-- Font Awesome 6 (무료) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: #0e0e12;
            color: #eaeef2;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem 1rem;
        }

        .app-wrapper {
            max-width: 1000px;
            width: 100%;
            background: #18181f;
            border-radius: 40px;
            padding: 2rem 2rem 2.5rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.02);
            transition: 0.2s;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 500;
            letter-spacing: -0.5px;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 12px;
            color: #f0f3f8;
        }
        h1 i {
            color: #5f8aff;
            font-size: 1.8rem;
        }

        .grid {
            display: flex;
            flex-direction: column;
            gap: 2.2rem;
        }

        /* 카드 */
        .card {
            background: #22222b;
            border-radius: 28px;
            padding: 1.6rem 1.8rem 1.8rem;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.03), 0 8px 20px rgba(0,0,0,0.6);
            transition: 0.15s;
            border: 1px solid #2e2e3a;
        }
        .card-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 1.2rem;
            font-weight: 500;
            font-size: 1.1rem;
            color: #c8d0dc;
        }
        .card-header i {
            color: #5f8aff;
            width: 1.6rem;
            font-size: 1.2rem;
        }

        .input-group {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px 16px;
            margin-bottom: 1rem;
        }
        .input-group label {
            font-size: 0.9rem;
            font-weight: 450;
            color: #b0bac9;
            letter-spacing: 0.3px;
        }
        .input-group input, 
        .input-group .fake-input {
            background: #121217;
            border: 1px solid #33333f;
            border-radius: 60px;
            padding: 0.7rem 1.2rem;
            font-size: 0.95rem;
            color: #f0f4fc;
            outline: none;
            transition: 0.15s;
            flex: 1 1 200px;
            min-width: 140px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.4);
        }
        .input-group input:focus {
            border-color: #5f8aff;
            background: #1a1a24;
        }
        .input-group input::placeholder {
            color: #5b6377;
        }
        .input-group .fake-input {
            background: #121217;
            cursor: default;
            opacity: 0.9;
        }

        .result-area {
            background: #14141c;
            border-radius: 24px;
            padding: 0.9rem 1.4rem;
            margin-top: 0.8rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-left: 3px solid #5f8aff;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.5);
        }
        .result-text {
            font-size: 1rem;
            font-weight: 400;
            word-break: break-all;
            color: #e6ecf5;
            letter-spacing: 0.2px;
            padding: 0.2rem 0;
        }
        .copy-btn {
            background: transparent;
            border: none;
            color: #8f9bb5;
            font-size: 1.3rem;
            cursor: pointer;
            padding: 0.3rem 0.6rem;
            border-radius: 40px;
            transition: 0.2s;
            flex-shrink: 0;
        }
        .copy-btn:hover {
            background: #2a2a36;
            color: #d0dbf5;
        }
        .copy-btn:active {
            background: #3d3d4e;
            color: white;
        }

        .inline-flex {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px 12px;
        }
        .badge-light {
            background: #2a2a36;
            padding: 0.3rem 1rem;
            border-radius: 60px;
            font-size: 0.85rem;
            color: #bcc6d9;
        }
        .sep {
            color: #3e4357;
            margin: 0 2px;
        }
        .row-dates {
            display: flex;
            flex-wrap: wrap;
            gap: 12px 20px;
            align-items: center;
        }
        .row-dates .input-group {
            margin-bottom: 0;
            flex: 1 1 180px;
        }
        .mini-group {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .input-group .small-input {
            flex: 0 1 100px;
        }

        .divider {
            height: 1px;
            background: #2d2d3b;
            margin: 1rem 0 1.2rem;
        }

        /* 반응형 */
        @media (max-width: 650px) {
            .app-wrapper { padding: 1.5rem; }
            .card { padding: 1.2rem; }
            .result-area { flex-wrap: wrap; gap: 0.5rem; }
        }
        .copy-feedback {
            font-size: 0.75rem;
            color: #6b7d9f;
            margin-left: 6px;
        }
    </style>
</head>
<body>
<div class="app-wrapper">
    <h1><i class="fas fa-cubes"></i> 업무 도구</h1>
    <div class="grid">

        <!-- 1. 숫자 변환기 -->
        <div class="card">
            <div class="card-header"><i class="fas fa-calculator"></i> 숫자 변환기</div>
            <div class="input-group">
                <label for="numInput">숫자 입력</label>
                <input type="text" id="numInput" placeholder="예: 11500" value="11500">
            </div>
            <div class="result-area" id="numResultArea">
                <span class="result-text" id="numResult">금115,000원(금일십일만오천원)</span>
                <button class="copy-btn" id="copyNumBtn" title="복사"><i class="far fa-clipboard"></i></button>
            </div>
        </div>

        <!-- 2. 날짜 변환 계산기 (요일) -->
        <div class="card">
            <div class="card-header"><i class="fas fa-calendar-alt"></i> 날짜 변환 · 요일</div>
            <div class="input-group">
                <label for="dateInput">날짜 (단일 / 범위)</label>
                <input type="text" id="dateInput" placeholder="2026. 1. 23. ~ 2026. 1. 24." value="2026. 1. 23. ~ 2026. 1. 24.">
            </div>
            <div class="result-area" id="dateResultArea">
                <span class="result-text" id="dateResult">2026. 1. 23.(금) ~ 2026. 1. 24.(토)</span>
                <button class="copy-btn" id="copyDateBtn" title="복사"><i class="far fa-clipboard"></i></button>
            </div>
        </div>

        <!-- 3. 일수 계산기 (3-in-1) -->
        <div class="card">
            <div class="card-header"><i class="fas fa-clock"></i> 일수 계산기</div>

            <!-- 3-1) 기간 계산 -->
            <div style="margin-bottom: 1.2rem;">
                <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 6px;">
                    <i class="fas fa-arrows-left-right" style="color:#5f8aff; width:1.4rem;"></i>
                    <span style="font-weight:450;">기간 계산</span>
                </div>
                <div class="row-dates">
                    <div class="input-group">
                        <label>시작일</label>
                        <input type="text" id="startDate" placeholder="2026.7.12" value="2026.7.12">
                    </div>
                    <div class="input-group">
                        <label>종료일</label>
                        <input type="text" id="endDate" placeholder="2026.7.13" value="2026.7.13">
                    </div>
                </div>
                <div class="result-area" id="periodResultArea">
                    <span class="result-text" id="periodResult">시작일 포함[2일] 시작일 미포함[1일]</span>
                    <button class="copy-btn" id="copyPeriodBtn" title="복사"><i class="far fa-clipboard"></i></button>
                </div>
            </div>

            <div class="divider"></div>

            <!-- 3-2) 특정 날짜 + n일 후 (포함/미포함) -->
            <div style="margin-bottom: 1.2rem;">
                <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 6px;">
                    <i class="fas fa-calendar-plus" style="color:#5f8aff; width:1.4rem;"></i>
                    <span style="font-weight:450;">날짜 + N일 후</span>
                </div>
                <div class="row-dates">
                    <div class="input-group">
                        <label>시작일</label>
                        <input type="text" id="afterBaseDate" placeholder="2026.7.12" value="2026.7.12">
                    </div>
                    <div class="input-group">
                        <label>일수</label>
                        <input type="number" id="afterDays" placeholder="3" value="3" style="max-width:90px;">
                    </div>
                </div>
                <div class="result-area" id="afterResultArea">
                    <span class="result-text" id="afterResult">시작일 포함[2026. 7. 15.] 시작일 미포함[2026. 7. 16.]</span>
                    <button class="copy-btn" id="copyAfterBtn" title="복사"><i class="far fa-clipboard"></i></button>
                </div>
            </div>

            <div class="divider"></div>

            <!-- 3-3) 특정 날짜 - n일 전 (포함/미포함) -->
            <div>
                <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 6px;">
                    <i class="fas fa-calendar-minus" style="color:#5f8aff; width:1.4rem;"></i>
                    <span style="font-weight:450;">날짜 - N일 전</span>
                </div>
                <div class="row-dates">
                    <div class="input-group">
                        <label>시작일</label>
                        <input type="text" id="beforeBaseDate" placeholder="2026.7.12" value="2026.7.12">
                    </div>
                    <div class="input-group">
                        <label>일수</label>
                        <input type="number" id="beforeDays" placeholder="3" value="3" style="max-width:90px;">
                    </div>
                </div>
                <div class="result-area" id="beforeResultArea">
                    <span class="result-text" id="beforeResult">시작일 포함[2026. 7. 10.] 시작일 미포함[2026. 7. 9.]</span>
                    <button class="copy-btn" id="copyBeforeBtn" title="복사"><i class="far fa-clipboard"></i></button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    (function() {
        // ---------- 유틸 ----------
        const weekdays = ['일', '월', '화', '수', '목', '금', '토'];

        // 날짜 파싱: "2026. 1. 23." 또는 "2026.1.23" 등
        function parseDateFromString(str) {
            if (!str) return null;
            // 공백 및 마침표 처리
            let cleaned = str.replace(/\s/g, '').replace(/\.+/g, '.').replace(/,$/, '');
            // "2026.1.23" 형태
            const parts = cleaned.split('.').filter(p => p.length > 0);
            if (parts.length < 3) return null;
            const year = parseInt(parts[0], 10);
            const month = parseInt(parts[1], 10) - 1;
            const day = parseInt(parts[2], 10);
            if (isNaN(year) || isNaN(month) || isNaN(day)) return null;
            const d = new Date(year, month, day);
            if (d.getFullYear() !== year || d.getMonth() !== month || d.getDate() !== day) return null;
            return d;
        }

        function formatDateWithDot(date) {
            if (!date || isNaN(date)) return '';
            const y = date.getFullYear();
            const m = date.getMonth() + 1;
            const d = date.getDate();
            return `${y}. ${m}. ${d}.`;
        }

        function formatDateWithWeekday(date) {
            if (!date || isNaN(date)) return '';
            const y = date.getFullYear();
            const m = date.getMonth() + 1;
            const d = date.getDate();
            const w = weekdays[date.getDay()];
            return `${y}. ${m}. ${d}.(${w})`;
        }

        // 숫자 변환: 11500 -> 금115,000원(금일십일만오천원)
        function numberToKorean(num) {
            if (num === undefined || num === null || isNaN(num)) return '';
            const numStr = String(num);
            const formatted = Number(num).toLocaleString('ko-KR');
            const units = ['', '만', '억', '조'];
            const digits = ['', '일', '이', '삼', '사', '오', '육', '칠', '팔', '구'];
            const smallUnits = ['', '십', '백', '천'];
            // 간단한 변환: 4자리씩 끊어서 읽기 (만, 억)
            function readChunk(chunk) {
                let result = '';
                const len = chunk.length;
                for (let i = 0; i < len; i++) {
                    const digit = parseInt(chunk[i], 10);
                    if (digit === 0) continue;
                    const pos = len - 1 - i;
                    result += digits[digit] + smallUnits[pos];
                }
                return result || '';
            }

            const str = String(num);
            const len = str.length;
            let chunks = [];
            let idx = len;
            while (idx > 0) {
                const start = Math.max(0, idx - 4);
                chunks.push(str.substring(start, idx));
                idx = start;
            }
            // chunks: [일의자리, 천...]  역순
            let korean = '';
            for (let i = 0; i < chunks.length; i++) {
                const chunk = chunks[i];
                const read = readChunk(chunk);
                if (read) {
                    korean = read + units[i] + korean;
                }
            }
            if (!korean) korean = '영';
            return `금${formatted}원(금${korean}원)`;
        }

        // ---------- DOM refs ----------
        const numInput = document.getElementById('numInput');
        const numResult = document.getElementById('numResult');
        const copyNumBtn = document.getElementById('copyNumBtn');

        const dateInput = document.getElementById('dateInput');
        const dateResult = document.getElementById('dateResult');
        const copyDateBtn = document.getElementById('copyDateBtn');

        const startDate = document.getElementById('startDate');
        const endDate = document.getElementById('endDate');
        const periodResult = document.getElementById('periodResult');
        const copyPeriodBtn = document.getElementById('copyPeriodBtn');

        const afterBaseDate = document.getElementById('afterBaseDate');
        const afterDays = document.getElementById('afterDays');
        const afterResult = document.getElementById('afterResult');
        const copyAfterBtn = document.getElementById('copyAfterBtn');

        const beforeBaseDate = document.getElementById('beforeBaseDate');
        const beforeDays = document.getElementById('beforeDays');
        const beforeResult = document.getElementById('beforeResult');
        const copyBeforeBtn = document.getElementById('copyBeforeBtn');

        // ---------- 업데이트 함수 ----------
        function updateNumber() {
            const raw = numInput.value.trim().replace(/,/g, '');
            const num = parseInt(raw, 10);
            if (isNaN(num) || raw === '') {
                numResult.textContent = '유효한 숫자를 입력하세요';
                return;
            }
            numResult.textContent = numberToKorean(num);
        }

        function updateDate() {
            const raw = dateInput.value.trim();
            if (!raw) { dateResult.textContent = '날짜를 입력하세요'; return; }
            // 범위 구분 "~" 
            const parts = raw.split('~').map(s => s.trim());
            if (parts.length === 1) {
                // 단일
                const d = parseDateFromString(parts[0]);
                if (!d) { dateResult.textContent = '형식 오류 (예: 2026. 1. 23.)'; return; }
                dateResult.textContent = formatDateWithWeekday(d);
            } else if (parts.length === 2) {
                const d1 = parseDateFromString(parts[0]);
                const d2 = parseDateFromString(parts[1]);
                if (!d1 || !d2) { dateResult.textContent = '형식 오류 (범위)'; return; }
                dateResult.textContent = `${formatDateWithWeekday(d1)} ~ ${formatDateWithWeekday(d2)}`;
            } else {
                dateResult.textContent = '형식 오류: "~" 하나만 사용';
            }
        }

        function updatePeriod() {
            const s = startDate.value.trim();
            const e = endDate.value.trim();
            if (!s || !e) { periodResult.textContent = '시작일과 종료일을 입력하세요'; return; }
            const d1 = parseDateFromString(s);
            const d2 = parseDateFromString(e);
            if (!d1 || !d2) { periodResult.textContent = '날짜 형식 오류 (예: 2026.7.12)'; return; }
            const diff = Math.abs(Math.floor((d2 - d1) / (1000 * 60 * 60 * 24)));
            const inclusive = diff + 1;
            const exclusive = diff;
            periodResult.textContent = `시작일 포함[${inclusive}일] 시작일 미포함[${exclusive}일]`;
        }

        function updateAfter() {
            const base = afterBaseDate.value.trim();
            const days = parseInt(afterDays.value, 10);
            if (!base || isNaN(days) || days < 0) { afterResult.textContent = '날짜와 일수를 확인하세요'; return; }
            const d = parseDateFromString(base);
            if (!d) { afterResult.textContent = '날짜 형식 오류'; return; }
            const incl = new Date(d);
            incl.setDate(incl.getDate() + days);
            const excl = new Date(d);
            excl.setDate(excl.getDate() + days + 1);
            afterResult.textContent = `시작일 포함[${formatDateWithDot(incl)}] 시작일 미포함[${formatDateWithDot(excl)}]`;
        }

        function updateBefore() {
            const base = beforeBaseDate.value.trim();
            const days = parseInt(beforeDays.value, 10);
            if (!base || isNaN(days) || days < 0) { beforeResult.textContent = '날짜와 일수를 확인하세요'; return; }
            const d = parseDateFromString(base);
            if (!d) { beforeResult.textContent = '날짜 형식 오류'; return; }
            const incl = new Date(d);
            incl.setDate(incl.getDate() - days);
            const excl = new Date(d);
            excl.setDate(excl.getDate() - days - 1);
            beforeResult.textContent = `시작일 포함[${formatDateWithDot(incl)}] 시작일 미포함[${formatDateWithDot(excl)}]`;
        }

        // ---------- 복사 함수 ----------
        function copyText(text, btn) {
            if (!text) return;
            navigator.clipboard?.writeText(text).then(() => {
                const original = btn.innerHTML;
                btn.innerHTML = '<i class="fas fa-check" style="color:#5f8aff;"></i>';
                setTimeout(() => { btn.innerHTML = original; }, 800);
            }).catch(() => {
                // fallback
                const ta = document.createElement('textarea');
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                ta.remove();
                const original = btn.innerHTML;
                btn.innerHTML = '<i class="fas fa-check" style="color:#5f8aff;"></i>';
                setTimeout(() => { btn.innerHTML = original; }, 800);
            });
        }

        // ---------- 이벤트 바인딩 ----------
        numInput.addEventListener('input', updateNumber);
        copyNumBtn.addEventListener('click', () => copyText(numResult.textContent, copyNumBtn));

        dateInput.addEventListener('input', updateDate);
        copyDateBtn.addEventListener('click', () => copyText(dateResult.textContent, copyDateBtn));

        startDate.addEventListener('input', updatePeriod);
        endDate.addEventListener('input', updatePeriod);
        copyPeriodBtn.addEventListener('click', () => copyText(periodResult.textContent, copyPeriodBtn));

        afterBaseDate.addEventListener('input', updateAfter);
        afterDays.addEventListener('input', updateAfter);
        copyAfterBtn.addEventListener('click', () => copyText(afterResult.textContent, copyAfterBtn));

        beforeBaseDate.addEventListener('input', updateBefore);
        beforeDays.addEventListener('input', updateBefore);
        copyBeforeBtn.addEventListener('click', () => copyText(beforeResult.textContent, copyBeforeBtn));

        // 초기 실행
        updateNumber();
        updateDate();
        updatePeriod();
        updateAfter();
        updateBefore();

        // 추가: 날짜 변환기에서 '~' 양쪽 공백 처리 
        // 이미 trim으로 처리함 
    })();
</script>
</body>
</html>
